name: ci
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install CPU torch (for Level 3+)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: install
        run: pip install -e ".[dev]"
      - name: reference solutions pass (levels are solvable + correct)
        run: BBM_IMPL=solution pytest -q
      - name: starters keep their gaps (pedagogy stays honest)
        run: |
          bad=0
          for f in levels/*/starter/*.py; do
            if ! grep -q "NotImplementedError" "$f"; then
              echo "::error::starter is missing its gaps: $f"
              bad=1
            fi
          done
          exit $bad
