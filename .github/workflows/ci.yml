name: ci
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: pip install -e ".[dev]"
      - name: reference solutions pass (levels are solvable + correct)
        run: BBM_IMPL=solution pytest -q
      - name: starters keep their gaps (pedagogy stays honest)
        run: |
          ! grep -rL "NotImplementedError" levels/*/starter/*.py
