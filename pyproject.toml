[project]
name = "build-break-models-from-scratch"
version = "0.1.0"
description = "Build AI models from scratch, then break them — a gamified, CTF-style tour of how models work and how they fail."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pradyoth P.", email = "pradyoth0@gmail.com" }]
dependencies = []

[project.optional-dependencies]
# Level 1 is pure standard library. Levels 2+ need these (CPU-only torch wheel).
levels = ["numpy>=1.26", "torch>=2.2"]
# Optional secure paid-provider layer (benign enrichment only — see docs/THREAT-MODEL.md).
providers = ["python-dotenv>=1.0", "keyring>=25"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["levels", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctf"]
